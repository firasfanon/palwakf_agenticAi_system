name: P3 Outbound Local Executor V1 Validation

on:
  push:
    branches:
      - task/AGENTIC-P3-OUTBOUND-LOCAL-EXECUTOR-V1
      - task/AGENTIC-CODEX-EXECUTION-PLANE-ADMISSION-V1
      - task/AGENTIC-C7R-PRE-GATE-A-PHASE-A-CAPABILITY-V1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python312-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install repository
        run: python -m pip install -e ".[dev]"
      - name: Focused outbound executor and C7R tests
        run: >-
          python -m pytest -q
          backend/tests/test_outbound_local_executor_v1.py
          backend/tests/test_outbound_capabilities_v1.py
          backend/tests/test_github_issue_transport_v1.py
          backend/tests/test_c7r_phase_a_v1.py
          backend/tests/test_c7r_trust_rotation_v1.py
      - name: Parse C7R bootstrap PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/Bootstrap-PalWakfC7RPreGateA.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "C7R_BOOTSTRAP_POWERSHELL_PARSE=PASS"
      - name: Repository-native regressions
        run: python -m pytest -q
      - name: Compile all
        run: python -m compileall -q backend/src backend/tests
      - name: Forbidden pattern scan
        shell: python
        run: |
          from pathlib import Path
          paths = [
              Path("backend/src/palwakf_local_agents/outbound_contracts_v1.py"),
              Path("backend/src/palwakf_local_agents/outbound_capabilities_v1.py"),
              Path("backend/src/palwakf_local_agents/outbound_local_executor_v1.py"),
              Path("backend/src/palwakf_local_agents/github_issue_transport_v1.py"),
              Path("backend/src/palwakf_local_agents/outbound_worker_v1.py"),
              Path("backend/src/palwakf_local_agents/windows_service_v1.py"),
          ]
          text = "\n".join(p.read_text(encoding="utf-8") for p in paths)
          forbidden = ["shell=True", "git add .", "--force", "push --force"]
          hits = [item for item in forbidden if item in text]
          if hits:
              raise SystemExit(f"FORBIDDEN_PATTERNS={hits}")
          print("FORBIDDEN_PATTERN_SCAN=PASS")
